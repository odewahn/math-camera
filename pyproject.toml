[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math-camera"
version = "0.1.0"
description = "macOS document camera to clipboard utility"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=5.0.0.93; platform_system == 'Darwin'",
    "pynput>=1.8.2; platform_system == 'Darwin'",
    "pyobjc-framework-avfoundation>=12.2.1; platform_system == 'Darwin'",
]

authors = [
    { name = "Owen Dewahn" },
]
keywords = ["camera", "clipboard", "macos", "opencv", "document-camera"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS :: MacOS X",
    "Environment :: MacOS X",
    "Topic :: Multimedia :: Graphics :: Capture",
]

[project.urls]
Homepage = "https://github.com/odewahn/math-camera"
Repository = "https://github.com/odewahn/math-camera"

[project.scripts]
math-camera = "math_camera.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
